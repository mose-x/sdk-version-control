name: Build & Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ====== Windows ======
  build-windows:
    # Wails builds Windows targets without CGO (WebView2 is loaded at runtime
    # via COM), so arm64 can be cross-compiled on an amd64 runner.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails & go-winres
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          go install github.com/tc-hib/go-winres@v0.4.0

      - name: Compute version
        # Tag form: refs/tags/v1.2.3 -> version 1.2.3. Fallback for
        # workflow_dispatch (no tag): 0.0.0-dev.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup NSIS
        # `wails build -nsis` (in scripts/build-windows.sh) shells out to
        # `makensis`. windows-latest ships NSIS under C:\Program Files (x86)\NSIS
        # but not on bash's PATH, so without this wails logs "makensis not
        # found", silently skips the installer, and the script's installer-rename
        # step fails. Add the NSIS dir to GITHUB_PATH so the bash step resolves
        # makensis; fall back to choco if the image layout ever changes.
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          )
          $nsisDir = $candidates | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) {
            choco install nsis -y --no-progress
            $nsisDir = "C:\Program Files (x86)\NSIS"
          }
          Add-Content $env:GITHUB_PATH $nsisDir
          Write-Host "NSIS dir: $nsisDir"
          & "$nsisDir\makensis.exe" /VERSION

      - name: Build & package
        # The packaging logic (about.json bump, go-winres, console shim,
        # wails build incl. frontend, asset naming) lives in
        # scripts/build-windows.sh so CI and local builds produce identical
        # artifacts. `wails build` runs npm install + npm run build via
        # wails.json hooks, so no separate frontend step is needed.
        shell: bash
        run: bash scripts/build-windows.sh "$VERSION" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-assets
          path: build/bin/SDKVersionControl-${{ env.VERSION }}-*

  # ====== macOS ======
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Compute version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build & package
        # scripts/build-macos.sh does NOT ad-hoc sign the .app (ad-hoc is
        # rejected by amfid -423 under MDM, worse than unsigned). The DMG
        # background tells users to right-click -> Open (English, red). See
        # note/t.md for the macOS provenance vs Gatekeeper analysis.
        shell: bash
        run: bash scripts/build-macos.sh "$VERSION" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-assets
          path: build/bin/SDKVersionControl-${{ env.VERSION }}-*

  # ====== Linux ======
  build-linux:
    # Wails v2 targets webkit2gtk-4.0 (pkg-config 'webkit2gtk-4.0'), which
    # Ubuntu 24.04 (noble) removed in favor of 4.1. Wails v2 does not yet
    # support 4.1 (that lands in Wails v3), so pin to ubuntu-22.04 (jammy)
    # where libwebkit2gtk-4.0-dev is still available. Linux ARM64 cannot be
    # cross-compiled from amd64 because Wails links webkit2gtk/gtk+-3.0 via
    # CGO; use a native arm64 runner instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Compute version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build & package
        # scripts/build-linux.sh installs system deps (idempotent), bumps
        # about.json, builds the bare binary, and wraps it in .deb/.rpm with a
        # .desktop entry + hicolor icons.
        shell: bash
        run: bash scripts/build-linux.sh "$VERSION" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-assets
          path: build/bin/SDKVersionControl-${{ env.VERSION }}-*

  # ====== Release ======
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          # Flatten all artifacts into staging/ instead of one subdirectory per
          # artifact (download-artifact's default). Without this, an asset named
          # `SDKVersionControl-1.0.0-windows-x64.exe` would land at
          # `staging/SDKVersionControl-1.0.0-windows-x64.exe/SDKVersionControl-1.0.0-windows-x64.exe`,
          # and the sha256sum glob would match the outer directory rather than the
          # file, breaking checksum generation.
          merge-multiple: true

      - name: Detect pre-release tag
        # Tags with a -rc/-beta/-alpha/-pre/-dev suffix are marked as GitHub
        # pre-releases so `releases/latest` excludes them. This protects users
        # on older builds (which hit releases/latest) from being offered an rc.
        # The in-app updater's pure-numeric filter (update.go) is the matching
        # client-side guard for newer builds.
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*|*-pre*|*-dev*)
              echo "IS_PRERELEASE=true" >> $GITHUB_ENV
              echo "Tag $TAG has a pre-release suffix -> marking as pre-release (excluded from releases/latest)"
              ;;
            *)
              echo "IS_PRERELEASE=false" >> $GITHUB_ENV
              echo "Tag $TAG is a stable release -> included in releases/latest"
              ;;
          esac

      - name: Generate sha256sums.txt
        # sha256sums.txt is shipped as a standalone release asset so the in-app
        # updater can verify each download against a recorded hash. Only binary
        # assets are hashed -- sha256sums.txt itself is excluded by the
        # SDKVersionControl-* prefix glob.
        shell: bash
        run: |
          set -eu
          cd staging
          sha256sum SDKVersionControl-* > sha256sums.txt
          echo "---sha256sums.txt---"
          cat sha256sums.txt

      - name: Create Release
        # Publish immediately (draft:false) so the GitHub Releases API endpoint
        # /releases/latest resolves for the in-app updater. A suffixed tag is
        # published as a pre-release (see step above) so it stays out of
        # releases/latest until a stable tag supersedes it.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/SDKVersionControl-*
            staging/sha256sums.txt
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
