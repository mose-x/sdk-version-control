name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ====== Windows ======
  build-windows:
    # Wails builds Windows targets without CGO (WebView2 is loaded at runtime
    # via COM), so arm64 can be cross-compiled on an amd64 runner.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails & go-winres
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/tc-hib/go-winres@latest

      - name: Generate Windows Resources
        run: |
          go-winres make --arch ${{ matrix.arch }} --out resource --no-suffix
          Rename-Item resource resource.syso
        shell: pwsh

      - name: Build
        shell: bash
        run: |
          wails build -nopackage -platform windows/${{ matrix.arch }} -o SDKVersionControl.exe
          # Wails appends the arch suffix when cross-compiling; normalize to
          # the plain name first, then rename with arch so amd64/arm64 don't
          # clobber each other when uploaded to the same release.
          if [ -f "build/bin/SDKVersionControl-${{ matrix.arch }}.exe" ] && [ ! -f "build/bin/SDKVersionControl.exe" ]; then
            mv "build/bin/SDKVersionControl-${{ matrix.arch }}.exe" "build/bin/SDKVersionControl.exe"
          fi
          mv build/bin/SDKVersionControl.exe "build/bin/SDKVersionControl_windows_${{ matrix.arch }}.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDKVersionControl_windows_${{ matrix.arch }}
          path: build/bin/SDKVersionControl_windows_${{ matrix.arch }}.exe

  # ====== macOS ======
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build .app
        run: |
          wails build -platform darwin/${{ matrix.arch }} \
            -o SDKVersionControl

      - name: Create DMG
        # Wails uses wails.json's info.productName ("SDK Version Control") as
        # the macOS .app bundle directory name, while the inner binary keeps
        # the outputfilename ("SDKVersionControl"). Reference the spaced path.
        run: |
          hdiutil create -volname "SDKVersionControl" \
            -srcfolder "build/bin/SDK Version Control.app" \
            -ov -format UDZO \
            build/bin/SDKVersionControl_darwin_${{ matrix.arch }}.dmg

      - name: Extract binary for self-update
        run: |
          cp "build/bin/SDK Version Control.app/Contents/MacOS/SDKVersionControl" \
            build/bin/SDKVersionControl_darwin_${{ matrix.arch }}.bin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SDKVersionControl_darwin_${{ matrix.arch }}_dmg
          path: build/bin/SDKVersionControl_darwin_${{ matrix.arch }}.dmg

      - name: Upload update binary
        uses: actions/upload-artifact@v4
        with:
          name: SDKVersionControl_darwin_${{ matrix.arch }}_update
          path: build/bin/SDKVersionControl_darwin_${{ matrix.arch }}.bin

  # ====== Linux ======
  build-linux:
    # Wails v2 targets webkit2gtk-4.0 (pkg-config 'webkit2gtk-4.0'), which
    # Ubuntu 24.04 (noble) removed in favor of 4.1. Wails v2 does not yet
    # support 4.1 (that lands in Wails v3), so pin to ubuntu-22.04 (jammy)
    # where libwebkit2gtk-4.0-dev is still available.
    # Linux ARM64 cannot be cross-compiled from amd64 because Wails links
    # webkit2gtk/gtk+-3.0 via CGO; use a native arm64 runner instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: |
          wails build -platform linux/${{ matrix.arch }} -o SDKVersionControl
          # Wails appends the arch suffix when cross-compiling; normalize to
          # the plain name first, then rename with arch so amd64/arm64 don't
          # clobber each other when uploaded to the same release.
          if [ -f "build/bin/SDKVersionControl-${{ matrix.arch }}" ] && [ ! -f "build/bin/SDKVersionControl" ]; then
            mv "build/bin/SDKVersionControl-${{ matrix.arch }}" "build/bin/SDKVersionControl"
          fi
          mv build/bin/SDKVersionControl "build/bin/SDKVersionControl_linux_${{ matrix.arch }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDKVersionControl_linux_${{ matrix.arch }}
          path: build/bin/SDKVersionControl_linux_${{ matrix.arch }}

  # ====== Release ======
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate version.json
        # Auto-generates version metadata for in-app self-update. about.json's
        # updateUrl points at https://github.com/<repo>/releases/latest/download/version.json
        # which GitHub redirects to this asset on the latest (non-draft) release.
        # The 6 download entries match the binaries produced above (macOS uses
        # the .bin "update binary" rather than the .dmg, since ApplyUpdate
        # replaces the bare executable, not the .app bundle).
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF#refs/tags/v}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"

          jq -n \
            --arg version "$VERSION" \
            --arg repo "$REPO_URL" \
            '{
              version: $version,
              changelog: ("Release v" + $version + " — see " + $repo + " for details"),
              downloads: {
                "windows-amd64": {url: ($repo + "/SDKVersionControl_windows_amd64.exe"), filename: "SDKVersionControl_windows_amd64.exe"},
                "windows-arm64": {url: ($repo + "/SDKVersionControl_windows_arm64.exe"), filename: "SDKVersionControl_windows_arm64.exe"},
                "darwin-amd64":  {url: ($repo + "/SDKVersionControl_darwin_amd64.bin"),  filename: "SDKVersionControl"},
                "darwin-arm64":  {url: ($repo + "/SDKVersionControl_darwin_arm64.bin"),  filename: "SDKVersionControl"},
                "linux-amd64":   {url: ($repo + "/SDKVersionControl_linux_amd64"),       filename: "SDKVersionControl"},
                "linux-arm64":   {url: ($repo + "/SDKVersionControl_linux_arm64"),       filename: "SDKVersionControl"}
              }
            }' > artifacts/version.json

          echo "Generated version.json:"
          cat artifacts/version.json

      - name: Create Release
        # Publish immediately (draft:false) so releases/latest/download/version.json
        # resolves. Edit the body manually afterwards if you want custom notes.
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
