name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ====== Windows ======
  build-windows:
    # Wails builds Windows targets without CGO (WebView2 is loaded at runtime
    # via COM), so arm64 can be cross-compiled on an amd64 runner.
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails & go-winres
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/tc-hib/go-winres@latest

      - name: Compute version & asset arch
        # Tag form: refs/tags/v1.2.3 → version 1.2.3
        # Map Go GOARCH → asset arch following nvm-rust convention (amd64 → x64).
        # Fallback for workflow_dispatch (no tag): 0.0.0-dev.
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        # Embed the release tag into about.json so the built binary reports
        # the correct version to CheckUpdate. Without this, the //go:embed'd
        # about.json keeps whatever version was last committed, and the app
        # would keep "finding an update" even after installing the new build.
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION:"
          cat about.json

      - name: Generate Windows Resources
        run: |
          go-winres make --arch ${{ matrix.arch }} --out resource --no-suffix
          Rename-Item resource resource.syso
        shell: pwsh

      - name: Build
        shell: bash
        run: |
          wails build -nopackage -platform windows/${{ matrix.arch }} -o SDKVersionControl.exe
          # Wails appends the arch suffix when cross-compiling; normalize to
          # the plain name first, then rename with the final asset name so
          # amd64/arm64 don't clobber each other when uploaded to the same release.
          if [ -f "build/bin/SDKVersionControl-${{ matrix.arch }}.exe" ] && [ ! -f "build/bin/SDKVersionControl.exe" ]; then
            mv "build/bin/SDKVersionControl-${{ matrix.arch }}.exe" "build/bin/SDKVersionControl.exe"
          fi
          ASSET_NAME="SDKVersionControl-${VERSION}-windows-${ASSET_ARCH}.exe"
          mv build/bin/SDKVersionControl.exe "build/bin/${ASSET_NAME}"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Build NSIS installer
        # NSIS installer for first-time install / manual download. The bare
        # .exe above is what the in-app self-updater downloads and swaps in
        # (it can't run an NSIS installer silently without admin/UAC issues),
        # so both artifacts are shipped: bare exe for updates, setup exe for
        # install. Wails' -nsis flag produces "SDKVersionControl-amd64.exe"
        # in build/bin; rename to the -setup.exe asset convention.
        shell: bash
        run: |
          wails build -nopackage -nsis -platform windows/${{ matrix.arch }} -o SDKVersionControl.exe
          SETUP_SRC="build/bin/SDKVersionControl-${{ matrix.arch }}.exe"
          if [ ! -f "$SETUP_SRC" ]; then
            SETUP_SRC="build/bin/SDKVersionControl.exe"
          fi
          SETUP_NAME="SDKVersionControl-${VERSION}-windows-${ASSET_ARCH}-setup.exe"
          mv "$SETUP_SRC" "build/bin/${SETUP_NAME}"
          echo "SETUP_NAME=$SETUP_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/bin/${{ env.ASSET_NAME }}

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SETUP_NAME }}
          path: build/bin/${{ env.SETUP_NAME }}

  # ====== macOS ======
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION:"
          cat about.json

      - name: Build .app
        run: |
          wails build -platform darwin/${{ matrix.arch }} \
            -o SDKVersionControl

      - name: Create DMG
        # Build a drag-to-Applications DMG (standard macOS install UX) using
        # create-dmg. --app-drop-link synthesizes the Applications folder
        # shortcut on the right; a plain dark background is generated with
        # sips from a solid color so no external asset is needed. Wails uses
        # wails.json's info.productName ("SDK Version Control") as the .app
        # bundle directory name; reference the spaced path.
        run: |
          brew install create-dmg
          # Generate a 960x600 dark background PNG via sips (no ImageMagick
          # dep). Pure color fill matches the app's dark theme.
          BG_PATH="build/bin/dmg_bg.png"
          python3 -c "
          import struct, zlib
          w, h = 960, 600
          raw = b''.join(b'\x1e\x1e\x2e\xff' * w for _ in range(h))
          def chunk(t, d): return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('$BG_PATH', 'wb').write(png)
          "
          DMG_NAME="SDKVersionControl-${VERSION}-macos-${ASSET_ARCH}.dmg"
          create-dmg \
            --volname "SDK Version Control" \
            --background "$BG_PATH" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --app-drop-link 480 200 \
            --icon "SDK Version Control.app" 180 200 \
            --no-internet-enable \
            "build/bin/${DMG_NAME}" \
            "build/bin/SDK Version Control.app"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Extract binary for self-update
        # ApplyUpdate replaces the bare executable inside the .app bundle, not
        # the bundle itself, so ship the inner binary as a separate .bin asset
        # for the in-app updater to download.
        run: |
          BIN_NAME="SDKVersionControl-${VERSION}-macos-${ASSET_ARCH}.bin"
          cp "build/bin/SDK Version Control.app/Contents/MacOS/SDKVersionControl" \
            "build/bin/${BIN_NAME}"
          echo "BIN_NAME=$BIN_NAME" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: build/bin/${{ env.DMG_NAME }}

      - name: Upload update binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}
          path: build/bin/${{ env.BIN_NAME }}

  # ====== Linux ======
  build-linux:
    # Wails v2 targets webkit2gtk-4.0 (pkg-config 'webkit2gtk-4.0'), which
    # Ubuntu 24.04 (noble) removed in favor of 4.1. Wails v2 does not yet
    # support 4.1 (that lands in Wails v3), so pin to ubuntu-22.04 (jammy)
    # where libwebkit2gtk-4.0-dev is still available.
    # Linux ARM64 cannot be cross-compiled from amd64 because Wails links
    # webkit2gtk/gtk+-3.0 via CGO; use a native arm64 runner instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION:"
          cat about.json

      - name: Build
        run: |
          wails build -platform linux/${{ matrix.arch }} -o SDKVersionControl
          # Wails appends the arch suffix when cross-compiling; normalize to
          # the plain name first, then rename with the final asset name so
          # amd64/arm64 don't clobber each other when uploaded to the same release.
          if [ -f "build/bin/SDKVersionControl-${{ matrix.arch }}" ] && [ ! -f "build/bin/SDKVersionControl" ]; then
            mv "build/bin/SDKVersionControl-${{ matrix.arch }}" "build/bin/SDKVersionControl"
          fi
          ASSET_NAME="SDKVersionControl-${VERSION}-linux-${ASSET_ARCH}"
          mv build/bin/SDKVersionControl "build/bin/${ASSET_NAME}"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/bin/${{ env.ASSET_NAME }}

  # ====== Release ======
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          # Flatten all artifacts into staging/ instead of one subdirectory
          # per artifact (download-artifact's default). Without this, an asset
          # named `SDKVersionControl-1.0.0-windows-x64.exe` would land at
          # `staging/SDKVersionControl-1.0.0-windows-x64.exe/SDKVersionControl-1.0.0-windows-x64.exe`,
          # and the sha256sum glob would match the outer directory rather than
          # the file, breaking checksum generation. Mirrors nvm-rust's setup.
          merge-multiple: true

      - name: Generate sha256sums.txt
        # sha256sums.txt is shipped as a standalone release asset so the
        # in-app updater can verify each download against a recorded hash.
        # Only binary assets are hashed — sha256sums.txt itself is excluded
        # by the SDKVersionControl-* prefix glob.
        shell: bash
        run: |
          set -eu
          cd staging
          sha256sum SDKVersionControl-* > sha256sums.txt
          echo "---sha256sums.txt---"
          cat sha256sums.txt

      - name: Create Release
        # Publish immediately (draft:false) so the GitHub Releases API endpoint
        # /releases/latest resolves for the in-app updater. Edit the body
        # manually afterwards if you want custom notes.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/SDKVersionControl-*
            staging/sha256sums.txt
          draft: false
          generate_release_notes: true
